[package]
name = "llman-sdd"
version.workspace = true
edition.workspace = true
description = "Spec-driven development core of llman (sdd subcommands, spec IR/validation, change lifecycle, project management)."
license = "MIT"
repository = "https://github.com/StrayDragon/llman"
publish = false

[dependencies]
anyhow.workspace = true
rust-i18n.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
llman-core.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.12.3"
sha2 = "0.11.0"
clap = { version = "4.6.1", features = [
    "env",
    "unicode",
    "wrap_help",
    "string",
    "cargo",
    "derive",
] }
inquire = { version = "0.9.4", features = ["editor"] }
minijinja = "2.20.0"
async-openai = { version = "0.41", default-features = false, features = ["rustls", "chat-completion"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time", "process", "io-std"] }
gherkin = "0.16"
glob = "0.3.3"
toml = "1.0.3"
sevenz-rust2 = "0.21.3"

[dev-dependencies]
tempfile.workspace = true
