[package]
name = "gherkin-zh"
version = "0.16.0"
edition = "2018"
rust-version = "1.88"
description = """\
    Fork of gherkin 0.16 adding the missing zh-CN 规则 rule keyword \
    (upstream zh-CN dict only localizes part of Gherkin 6 keywords). \
    Published from the llman workspace: vendored, published as its own \
    registry crate because cargo strips git sources from published \
    manifests — a plain git dep would silently resolve to upstream \
    gherkin for crates.io consumers.\
    """
license = "MIT OR Apache-2.0"
authors = ["Brendan Molloy <brendan@bbqsrc.net>"]
repository = "https://github.com/StrayDragon/gherkin"
readme = "README.md"
categories = ["compilers", "parser-implementations"]
keywords = ["gherkin", "cucumber", "cucumber-gherkin", "testing", "bdd"]
include = ["/src/", "/build.rs", "/LICENSE-*", "/README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["parser"]
# Enables ability to parse AST.
parser = ["dep:typed-builder"]

[dependencies]
peg = "0.6.3"
textwrap = "0.16"
thiserror = "2.0"

# "parser" feature dependencies.
typed-builder = { version = "0.23", optional = true }

# "serde" feature enables ability to serialize/deserialize AST.
serde = { version = "1.0.103", features = ["derive"], optional = true }

# "juniper" feature enables ability to use AST as GraphQL types.
juniper = { version = "0.17", default-features = false, optional = true }

[build-dependencies]
heck = "0.5"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = "2.0"

[dev-dependencies]
# src/parser.rs unit tests (serde AST round-trips) use serde_json.
serde_json = "1.0.78"
