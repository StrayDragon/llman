name: CI

on:
  push:
    branches: [ "main" ]

env:
  # Bump when cache strategy changes to force refresh
  CACHE_VERSION: v4

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ env.CACHE_VERSION }}-

      - name: Install Rust toolchain
        # No `toolchain` input: rustup resolves via rust-toolchain.toml (SSOT),
        # so CI and local always build with the same pinned nightly.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Print useful env versions
        run: |
          rustup --version
          cargo --version
          rustc --version
          rustfmt --version
          cargo clippy --version

      - name: Setup justfile
        uses: extractions/setup-just@v4

      # tests/bdd (Gherkin BDD suite, bun bridge) — zero npm deps, bun only.
      # llman-sdd is installed so the sdd-* contract scenarios execute. It
      # must be the standalone release binary: the BDD harness runs
      # llman-sdd under a hermetic child PATH (/usr/bin:/bin + fixtures)
      # where npm/bun global shims (#/usr/bin/env bun) can't resolve their
      # interpreter and every delegated call dies with exit 127.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
      - name: Install llman-sdd
        run: |
          version=0.5.1
          cd "$(mktemp -d)"
          curl -sSfL -o llman-sdd-linux-x64 "https://github.com/StrayDragon/llman-sdd/releases/download/v${version}/llman-sdd-linux-x64"
          curl -sSfL -o llman-sdd-linux-x64.sha256 "https://github.com/StrayDragon/llman-sdd/releases/download/v${version}/llman-sdd-linux-x64.sha256"
          sha256sum -c llman-sdd-linux-x64.sha256
          install -m 0755 llman-sdd-linux-x64 /usr/local/bin/llman-sdd
          llman-sdd --version

      - name: Check all
        run: just check-all

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ env.CACHE_VERSION }}-

      - name: Install Rust toolchain
        # No `toolchain` input: rustup resolves via rust-toolchain.toml (SSOT),
        # so CI and local always build with the same pinned nightly.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Print useful env versions
        run: |
          rustup --version
          cargo --version
          rustc --version
          rustfmt --version
          cargo clippy --version

      - name: Setup justfile
        uses: extractions/setup-just@v4

      - name: Build checks
        run: just build-release

  deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # License allowlist + RustSec advisories + duplicate/ban policy
      # (deny.toml). Full sweep repeats monthly in supply-chain.yml.
      - name: Check
        uses: EmbarkStudios/cargo-deny-action@v2
