[workspace]
members = [".", "crates/llman-core", "crates/llman-sdd"]

[workspace.package]
version = "0.0.71"
edition = "2024"

# Single source of truth for dependency versions shared across workspace
# members. Crates reference entries via `dep.workspace = true` and MUST NOT
# redeclare inline versions.
[workspace.dependencies]
anyhow = "1.0.102"
rust-i18n = "4.2.1"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps Value maps in document/insertion order (IndexMap),
# matching the ordering guarantees the removed serde_yaml::Mapping provided.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
# serde_yaml is archived/deprecated; serde-saphyr provides the YAML
# (de)serializer plus Commented-based comment capture support.
serde-saphyr = "1.1.0"
schemars = { version = "1.2.1", features = ["derive", "indexmap2"] }
# default-features off: schema refs are always materialized inline, so the
# default resolve-http/tls features (reqwest + aws-lc-rs) are dead weight.
jsonschema = { version = "0.48.5", default-features = false }
tempfile = "3.26.0"
clap = { version = "4.6.1", features = [
    "env",
    "unicode",
    "wrap_help",
    "string",
    "cargo",
    "derive",
] }
inquire = { version = "0.9.4", features = ["editor"] }
# Terminal width probing for the hand-rolled preview tables (src/tool/table.rs)
crossterm = "0.29.0"
unicode-width = "0.2"
thiserror = "2.0.18"
toml = "1.0.3"
minijinja = "2.20.0"
# (chrono replaced by `time` 0.3 for sdd timestamps/durations)
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
glob = "0.3.3"
ignore = "0.4.26"
sha2 = "0.11.0"
regex = "1.12.3"
gherkin = "0.16"
sevenz-rust2 = "0.22.2"
llm_json = "1.0.2"
# Blocking HTTP (rustls) for the sdd pageindex chat-model invoker. Chosen over
# reqwest/async-openai: the agentic loop is sequential, one JSON round-trip per
# turn — an async runtime + hyper stack would be ~45% of the dependency graph.
ureq = { version = "3", features = ["json"] }
llman-core = { path = "crates/llman-core" }
llman-sdd = { path = "crates/llman-sdd" }

# Workspace-wide lint policy (SSOT). Every crate opts in via
# `[lints] workspace = true`. Tighten deliberately: anything warn-level here
# fails CI (`cargo clippy -- -D warnings`).
[workspace.lints.rust]
# Deliberate escapes: src/test_utils.rs and sdd change finalize use
# `unsafe { std::env::… }` blocks for process-env test isolation (unsafe in
# edition 2024). Keep them visible in review rather than forbidden.
unsafe_code = "allow"

[workspace.lints.clippy]
# Explicit: the default clippy groups (correctness/suspicious/complexity/perf
# + style) remain the enforced baseline across every crate.
all = "warn"

[package]
name = "llman"
version.workspace = true
# Project is pinned to a nightly toolchain in rust-toolchain.toml
# CI must use the same pinned nightly baseline
edition.workspace = true
default-run = "llman"
authors = ["L8ng <straydragonl@foxmail.com>"]
description = "A tool for managing LLM application rules(prompts) ..."
license = "MIT"
repository = "https://github.com/StrayDragon/llman"

# One consolidated integration-test target instead of 22 auto-discovered
# per-file binaries (each statically linking the whole workspace). Modules
# live in tests/it/; bdd_steps.rs stays a separate auto-discovered target.
[[test]]
name = "it"
path = "tests/it/main.rs"

[[bin]]
name = "llman"
path = "src/main.rs"

[[bin]]
name = "llmanspec"
path = "src/bin/llmanspec.rs"

[lib]
name = "llman"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
llman-core.workspace = true
llman-sdd.workspace = true
clap.workspace = true
clap_complete = "4.6.5"
inquire.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
thiserror.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
time.workspace = true
glob.workspace = true
ignore.workspace = true
tempfile.workspace = true
sha2.workspace = true

# Comment processing and parsing
tree-sitter = "0.26.6"
tree-sitter-highlight = "0.26.6"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-go = "0.25.0"

# Configuration and validation
schemars.workspace = true
jsonschema.workspace = true

# JSON parsing and repair
llm_json.workspace = true

# Additional utilities
regex.workspace = true
serde-saphyr.workspace = true

[features]
# BDD feature-as-spec testing via rstest-bdd. Opt-in: `cargo test --features bdd`.
# Default `cargo test` skips BDD scenarios to avoid the extra compile cost.
# Note: rstest/rstest-bdd are always in dev-dependencies (Cargo disallows optional
# dev-deps); the `bdd` feature only gates the test code via #[cfg(feature = "bdd")].
bdd = []

[dev-dependencies]
rstest = "0.26"
rstest-bdd = "0.6.0-beta3"
rstest-bdd-macros = "0.6.0-beta3"

# Keep `target/` growth in check:
# - Compile workspace code with `line-tables-only` debuginfo: backtraces keep
#   function names + line numbers (enough to diagnose failures) while skipping
#   the DWARF variable/type tables that dominate on-disk size.
# - Compile third-party dependencies with no debug info at all.
# See also `.cargo/config.toml` (-Zshare-generics) for cross-crate symbol dedup.
#
# See: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0

# Fork of gherkin adding the missing zh-CN 规则 rule keyword
# (upstream zh-CN dict only localizes part of Gherkin 6 keywords).
# NOTE: semver-scoped — replaces gherkin 0.16 consumers (llman itself).
# rstest-bdd-macros pins gherkin 0.14 and keeps upstream; harmless because it
# never collects Rule-block scenarios anyway (llman's gate rejects them first).
[patch.crates-io]
gherkin = { git = "https://github.com/StrayDragon/gherkin.git" }
