# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman-sdd/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: zh-Hans

# 盘点结论（add-sdd-pipeline-guards T7）：apply 的自修复升级路径需要
# arch-review 接收架构缺口；启用后 init --update 会安装渲染产物。
extra_skills:
  - llman-sdd-arch-review

# llman-sdd 0.5 起规格为原生 Gherkin 分层格式（规则: 块 + 嵌套场景），历史标签
# 不再承载语义；本仓库无可执行规格 harness（tests/bdd_steps.rs 已随 0.0.79 移除），
# 故不配置 bdd.run_command，validate 不再运行 BDD harness。
# `llman sdd` 各命令行为由外部 llman-sdd v2 项目所有。
