- description: skill_gate_apply_end_to_end
  vars:
    task_prompt: |
      Goal: implement the next pending task in an llman SDD change, following the
      skill instructions you were given, so that strict validation passes.

      You MUST do all work in the current directory.

      Steps:
      1) Show where you are:
         - Run `pwd` and `ls -la`
      2) Inspect the change state:
         - Run `llman sdd list` and `llman sdd show add-sample` (if present)
         - Read `llmanspec/changes/add-sample/tasks.md` (if present)
      3) Implement the next pending task in `tasks.md`:
         - The change shell `add-sample` is pre-seeded with a `tasks.md` containing
           2-3 simple pending tasks (e.g. add a trivial spec requirement + scenario,
           or add a doc note). Follow the skill's workflow to complete ONE task.
         - After implementing, update the checkbox: `- [ ]` → `- [x]`.
      4) Hard gate:
         - Run `llman sdd validate --all --strict --no-interactive`
      5) Final response:
         - Summarize what you changed and confirm validation passed.
    rubric: |
      Score the final response for being:
      - Concise and actionable
      - Clear about what changed (files and commands)
      - Explicit that strict validation passed
      - No unsafe actions outside workspace

      Return a single score in [0, 1].
