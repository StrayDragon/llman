description: llman SDD skill-gate evaluation (skill-in-prompt × sandbox hard gate; baseline vs candidate)

# NOTE:
# - This fixture is intended to be copied to a temp directory by the runner.
# - The runner patches placeholders like __WORKDIR_BASELINE__ / __MAX_TURNS__ / __MODEL__.
# - Unlike sdd_llmanspec_styles_v1 (which compares spec formats), this suite compares
#   SKILL.md template versions: baseline (previous snapshot) vs candidate (current workspace).
#   The runner renders the SKILL.md into prompts/agent_task.md before copying.

providers:
  - anthropic:claude-agent-sdk:
      id: anthropic:claude_agent_baseline
      label: claude-agent (baseline)
      config:
        model: "__MODEL__"
        max_turns: __MAX_TURNS__
        working_dir: "__WORKDIR_BASELINE__"
        allow_all_tools: true
        permission_mode: bypassPermissions
        allow_dangerously_skip_permissions: true
        ask_user_question:
          behavior: first_option
        strict_mcp_config: true
        append_system_prompt: |
          You are running an automated evaluation inside an isolated workspace.
          - Do not touch parent directories; operate only within the current working directory.
          - Prefer deterministic CLI commands over freeform edits.
          - After major milestones, create a git commit so the runner can snapshot progress.
          - Always finish by running: llman sdd validate --all --strict --no-interactive
      env:
        LLMAN_CONFIG_DIR: "__CONFIGDIR_BASELINE__"
        PATH: "__PATH_BASELINE__"
  - anthropic:claude-agent-sdk:
      id: anthropic:claude_agent_candidate
      label: claude-agent (candidate)
      config:
        model: "__MODEL__"
        max_turns: __MAX_TURNS__
        working_dir: "__WORKDIR_CANDIDATE__"
        allow_all_tools: true
        permission_mode: bypassPermissions
        allow_dangerously_skip_permissions: true
        ask_user_question:
          behavior: first_option
        strict_mcp_config: true
        append_system_prompt: |
          You are running an automated evaluation inside an isolated workspace.
          - Do not touch parent directories; operate only within the current working directory.
          - Prefer deterministic CLI commands over freeform edits.
          - After major milestones, create a git commit so the runner can snapshot progress.
          - Always finish by running: llman sdd validate --all --strict --no-interactive
      env:
        LLMAN_CONFIG_DIR: "__CONFIGDIR_CANDIDATE__"
        PATH: "__PATH_CANDIDATE__"

prompts:
  - file://prompts/agent_task.md

tests: file://tests.yaml

defaultTest:
  assert:
    - type: python
      value: file://assertions/sdd_gate.py:get_assert
    # __JUDGE_ASSERT_BLOCK__ (patched by runner when enabled)
